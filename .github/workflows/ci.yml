name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      USE_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 회귀 테스트 (수집 · API · 저장 · 분석)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 브라우저 SDK 규약 점검
        run: node tests/collector_selfcheck.js

      - name: 생성물이 소스와 일치하는지
        # 문서·데모를 다시 빌드해서 커밋된 것과 달라지면 실패한다.
        # 코드를 고치고 재빌드를 잊은 채 커밋하는 것을 막는다.
        run: |
          python -m scripts.build_docs
          python -m scripts.build_demo
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ 생성물이 소스와 다릅니다. build_docs · build_demo 를 돌리고 커밋하세요."
            exit 1
          }
